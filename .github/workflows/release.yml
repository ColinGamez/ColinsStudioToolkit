name: Toolkit Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version matching package.json (for example 2.2.1)
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check toolkit
        run: npm run check
      - name: Check theme contrast
        run: npm run check:themes
      - name: Package commercial toolkit
        run: npm run package
      - name: Validate release version
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync('package.json')); if (!/^\d+\.\d+\.\d+$/.test(process.env.RELEASE_VERSION) || p.version !== process.env.RELEASE_VERSION) process.exit(1);"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$RELEASE_VERSION" "dist/colins-developer-toolkit-$RELEASE_VERSION.vsix" --target "$GITHUB_SHA" --title "Colin's Developer Toolkit $RELEASE_VERSION" --generate-notes
